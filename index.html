<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hacker News</title>
<meta name="description" content="A one-handed Hacker News reader that uses both screens of a foldable.">
<meta name="theme-color" content="#ff6600">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hacker News">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal-l:env(safe-area-inset-left,0px);--sar-l:env(safe-area-inset-right,0px)}
/* A two-page Hacker News reader. On an unfolded foldable the list is the left page,
   the story and its comments the right page, and the split sits on the fold. */
/* Warm off-white pages, an orange bar, and a light humanist sans. */
:root {
  --bg: #fffcfa;
  --surface: #fffcfa;
  --fg: #372828;
  --muted: #877d7c;
  --url: #877d7c;
  --faint: #aaa29f;
  --line: #eceae8;
  --cline: #e7e5e3;
  --accent: #ff6600;
  --accent-ink: #ffffff;
  --accent-soft: #fff0e6;
  --bar: #ff6600;
  --bar-ink: rgba(255,255,255,.7);
  --bar-ink-soft: rgba(255,255,255,.6);
  --side: #fcfaf8;
  --bubble-bg: #fff0e6;
  --bubble-fg: #ff6600;
  --box-bg: #f6f4f2;
  --box-fg: #867c7b;
  --head-bg: #ff6e0d;
  --head-title: rgba(255,255,255,.85);
  --head-link: rgba(255,255,255,.65);
  --head-meta: rgba(255,255,255,.5);
  --head-box: rgba(0,0,0,.04);
  --head-rule: #ff6600;
  --story-bg: #fef1e7;
  --gutter: #f2efed;
  --reply: rgba(255,102,0,.6);
  --age: #888888;
  --spine: #e6e1dd;
  --banner-bg: #fff3d4;
  --banner-fg: #5f4500;
  --font: "Source Sans Pro", "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs: 1;
  --split: 50%;
  --hair: 1px;
  --gap: 18px;
}
@media (min-resolution: 2dppx) { :root { --hair: .5px; } }
@media (min-resolution: 3dppx) { :root { --hair: .34px; } }
html.night {
  --bg: #1c1a19; --surface: #1c1a19; --fg: #d8d0cc; --muted: #8f8684; --url: #857c7a; --faint: #6f6866; --line: #2c2927; --cline: #2c2927;
  --accent: #ff7a26; --accent-ink: #1c1a19; --accent-soft: #33241a;
  --bar: #2a2624; --bar-ink: rgba(255,255,255,.7); --bar-ink-soft: rgba(255,255,255,.5);
  --side: #211f1e; --bubble-bg: #3a2618; --bubble-fg: #ff8a3d; --box-bg: #2a2725; --box-fg: #8f8684;
  --head-bg: #2a2624; --head-title: rgba(255,255,255,.85); --head-link: rgba(255,255,255,.6); --head-meta: rgba(255,255,255,.45); --head-box: rgba(255,255,255,.06); --head-rule: #ff7a26;
  --story-bg: #24211f; --gutter: #262321; --reply: rgba(255,122,38,.6); --age: #7d7674; --spine: #0d0c0c;
  --banner-bg: #3a2d0c; --banner-fg: #f3d68c;
  color-scheme: dark;
}

html { color-scheme: light; height: 100%; font-size: calc(16px * var(--fs)); -webkit-text-size-adjust: 100%; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
[hidden] { display: none !important; }
* { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- frame ---------- */
#app { height: 100%; display: grid; grid-template-columns: 100%; position: relative; overflow: hidden; }
#app.two { grid-template-columns: var(--split) var(--gap) minmax(0, 1fr); background: var(--spine); }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); position: relative; }
#spine { display: none; }
#app.two #spine { display: block; background: var(--spine); }
#app.one #listPane, #app.one #detailPane { grid-area: 1 / 1; }
#app.one #detailPane { transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); z-index: 2; box-shadow: -8px 0 24px rgba(0,0,0,.08); }
#app.one.reading #detailPane { transform: none; }
#app.one.reading #listPane { visibility: hidden; transition: visibility 0s .28s; }
#app.two .only-one { display: none !important; }
@media (prefers-reduced-motion: reduce) { #app.one #detailPane { transition: none; } }

.bar { flex: none; display: flex; align-items: center; gap: 0; background: var(--surface); border-color: var(--line); border-style: solid; border-width: 0; }
.topbar { background: var(--bar); color: var(--bar-ink); border-width: 0; height: calc(45px + var(--sat)); padding: var(--sat) calc(4px + var(--sar-l)) 0 calc(11px + var(--sal-l)); }
.bottombar { border-top-width: 1px; padding: 0 calc(6px + var(--sar-l)) var(--sab) calc(6px + var(--sal-l)); }
#app.two #listPane .topbar, #app.two #listPane .bottombar { padding-right: 4px; }
#app.two #detailPane .topbar { padding-left: 11px; }
#app.two #detailPane .bottombar { padding-left: 6px; }

.brand { display: flex; align-items: center; gap: 22px; margin-right: auto; min-width: 0; color: var(--bar-ink); }
.menu-btn { display: grid; place-items: center; width: 22px; height: 45px; color: inherit; flex: none; }
.menu-btn svg { width: 22px; height: 22px; }
.brand-txt { display: flex; flex-direction: column; min-width: 0; }
.brand-txt b { font-weight: 400; font-size: .9375rem; line-height: 1.125rem; }
.brand-txt small { font-weight: 300; color: var(--bar-ink-soft); font-size: .75rem; line-height: 1rem; margin-top: 1px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 4px; color: var(--muted); flex: none; text-decoration: none; }
.icon-btn:active { background: var(--accent-soft); }
.topbar .icon-btn { color: var(--bar-ink); width: 40px; height: 45px; }
.topbar .icon-btn:active { background: rgba(255,255,255,.15); }
.icon-btn svg { width: 22px; height: 22px; }
.topbar .icon-btn svg { width: 19px; height: 19px; }
.icon-btn[aria-pressed="true"] { color: var(--accent); }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.scroller { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; position: relative; }

/* ---------- banner ---------- */
.banner { flex: none; background: var(--banner-bg); color: var(--banner-fg); font-size: .8rem; line-height: 1.35; padding: .55rem 14px; }

/* ---------- tabs ---------- */
.tabs { display: flex; width: 100%; }
.tab { flex: 1; min-width: 0; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .75rem; font-weight: 400; color: var(--muted); }
.tab svg { width: 20px; height: 20px; }
.tab[aria-selected="true"] { color: var(--accent); }

/* ---------- pull to refresh ---------- */
.ptr { height: 0; overflow: hidden; display: grid; place-items: end center; color: var(--muted); font-size: .78rem; }
.ptr span { padding-bottom: 10px; }

/* ---------- story list ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.story { position: relative; border-bottom: var(--hair) solid var(--line); background: var(--surface); }
.story.sel { background: var(--accent-soft); }
.s-left { min-width: 0; padding: 9px calc(76px + var(--sar-l)) 11px calc(15px + var(--sal-l)); }
#app.two .s-left { padding-left: 15px; padding-right: 76px; }
.s-main { display: block; text-decoration: none; color: inherit; }
.s-title { display: block; font-size: 1rem; line-height: 1.3125rem; font-weight: 400; color: var(--fg); overflow-wrap: anywhere; }
.s-meta { display: block; margin-top: 8px; font-size: .8rem; font-weight: 300; line-height: 1.25rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-meta span + span { margin-left: 10px; }
.s-meta .new { color: var(--accent); }
.s-url { display: block; font-size: .8rem; font-weight: 300; line-height: 1.25rem; color: var(--url); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-url:active { color: var(--accent); }
.s-side { position: absolute; top: 0; bottom: 0; right: var(--sar-l); width: 50px; background: var(--side); text-decoration: none; }
#app.two .s-side { right: 0; }
.story.sel .s-side { background: transparent; }
.bubble { position: absolute; top: 13px; left: 50%; transform: translateX(-50%); min-width: 37px; height: 21px; padding: 0 7px; box-sizing: border-box; border-radius: 50%; background: var(--bubble-bg); color: var(--bubble-fg); font-size: .84375rem; line-height: 21px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bubble::after { content: ""; position: absolute; left: 7px; top: 100%; margin-top: -1px; border-style: solid; border-width: 7px 7px 0 0; border-color: var(--bubble-bg) transparent transparent transparent; }
.cbox { position: absolute; left: 0; right: 0; bottom: 11px; height: 19px; background: var(--box-bg); color: var(--box-fg); font-size: .75rem; font-weight: 300; line-height: 19px; text-align: center; font-variant-numeric: tabular-nums; }
.story.read .bubble, .story.read .cbox { opacity: .5; }
.list-foot { padding: 1.4rem 16px 2rem; text-align: center; color: var(--muted); font-size: .85rem; }
.list-foot button, .empty button { color: var(--accent); font-weight: 600; padding: .6rem 1rem; border-radius: 6px; background: var(--accent-soft); }
.skel { height: 4.4rem; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, var(--surface) 0, var(--bg) 50%, var(--surface) 100%) 0 0 / 200% 100%; animation: shimmer 1.2s ease-in-out infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

/* ---------- detail ---------- */
.d-title-bar { flex: 1; min-width: 0; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.detail { padding: 0 0 5.5rem; }
.d-top { border-bottom: 5px solid var(--head-rule); }
.d-head { background: var(--head-bg); padding: 8px calc(16px + var(--sar-l)) 8px calc(15px + var(--sal-l)); border-bottom: var(--hair) solid var(--accent); }
#app.two .d-head { padding-left: 15px; padding-right: 16px; }
.d-head h1 { margin: 0; font-size: 1rem; line-height: 1.4rem; font-weight: 400; color: var(--head-title); overflow-wrap: anywhere; }
.d-head h1 a { text-decoration: none; color: inherit; }
.d-meta { margin-top: 7px; font-weight: 300; display: flex; flex-wrap: wrap; align-items: center; font-size: .84375rem; line-height: 24px; color: var(--head-meta); font-variant-numeric: tabular-nums; }
.d-meta > * { margin-right: 14px; }
.d-meta .hbox { margin-right: 8px; padding: 0 6px; min-width: 37px; border-radius: 2px; font-size: .8125rem; box-sizing: border-box; text-align: center; background: var(--head-box); }
.d-meta .pts { display: inline-flex; align-items: center; gap: 5px; margin-left: -5px; }
.d-meta svg { width: 13px; height: 13px; flex: none; }
.d-links { margin-top: 3px; }
.d-link { display: flex; align-items: center; gap: 6px; color: var(--head-link); text-decoration: none; font-size: .9375rem; line-height: 1.833rem; min-width: 0; }
.d-link svg { width: 14px; height: 14px; flex: none; }
.d-link span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.d-story { background: var(--story-bg); padding: 10px calc(16px + var(--sar-l)) 10px calc(16px + var(--sal-l)); }
#app.two .d-story { padding-left: 16px; padding-right: 16px; }
.d-text { font-size: .9375rem; line-height: 1.62; color: var(--fg); overflow-wrap: anywhere; }
.d-text > :first-child { margin-top: 0; }
.d-count { padding: .6rem calc(16px + var(--sar-l)) .6rem calc(16px + var(--sal-l)); font-size: .84375rem; color: var(--muted); border-top: 1px solid var(--cline); }
#app.two .d-count { padding-left: 16px; padding-right: 16px; }
.empty { padding: 3rem 1rem; text-align: center; color: var(--muted); font-size: .9375rem; line-height: 1.5; display: grid; gap: 1rem; justify-items: center; }
.empty svg { width: 56px; height: 56px; color: var(--faint); }

/* ---------- comments ---------- */
.c { border-top: var(--hair) solid var(--cline); }
.c-kids { margin-left: 1px; border-left: 14px solid var(--gutter); }
.c-top { display: flex; align-items: center; height: 2.5rem; padding: 0 calc(16px + var(--sar-l)) 0 calc(16px + var(--sal-l)); }
#app.two .c-top { padding-left: 16px; padding-right: 16px; }
.c-kids .c-top, #app.two .c-kids .c-top { padding-left: 16px; }
.c-reply { flex: none; display: grid; place-items: center; height: 2.5rem; padding-right: 30px; color: var(--reply); }
.c-reply svg { width: 10px; height: 10px; }
.c-head { flex: 1; min-width: 0; display: flex; align-items: center; height: 2.5rem; text-align: left; font-size: .9375rem; color: var(--age); font-variant-numeric: tabular-nums; white-space: nowrap; }
.c-head .by, .c-head .when { display: inline-flex; align-items: center; }
.c-head .by { color: var(--accent); gap: 5px; margin-right: 30px; }
.c-head .when { gap: 7px; }
.c-head .by svg { width: 12px; height: 13px; flex: none; opacity: .6; }
.c-head .when svg { width: 9px; height: 13px; flex: none; opacity: .6; }
.c-head .op { font-size: .6875rem; font-weight: 600; letter-spacing: .04em; color: var(--accent-ink); background: var(--accent); padding: 0 4px; border-radius: 2px; margin: 0 22px 0 -22px; line-height: 16px; }
.c-head .fold { display: none; margin-left: auto; color: var(--muted); }
.c.folded > .c-top .fold { display: inline; }
.c-text { font-size: .9375rem; line-height: 1.62; color: var(--fg); overflow-wrap: anywhere; padding: 0 calc(16px + var(--sar-l)) 20px calc(16px + var(--sal-l)); }
#app.two .c-text { padding-left: 16px; padding-right: 16px; }
.c-kids .c-text, #app.two .c-kids .c-text { padding-left: 16px; }
.c-text p, .d-text p { margin: 10px 0 0; }
.c-text a, .d-text a { color: var(--accent); text-decoration: none; }
.c-text pre, .d-text pre { overflow-x: auto; background: var(--gutter); padding: .6rem .7rem; font-size: .8125rem; line-height: 1.4; }
.c-text code, .d-text code { font-family: var(--mono); font-size: .88em; }
.c-text .quote { color: var(--muted); }
.c.folded > .c-body { display: none; }
.c.folded > .c-top .fold::before { content: "+"; }
.c.dead .c-text { color: var(--faint); font-style: italic; }
.more { margin: 1.2rem 16px; }

/* ---------- floating next-comment button ---------- */
.fab { position: absolute; right: calc(14px + var(--sar-l)); bottom: calc(66px + var(--sab)); width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.18); z-index: 3; }
#app.two .fab { right: 14px; }
.fab svg { width: 24px; height: 24px; }

/* ---------- settings sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35); display: grid; align-items: end; justify-items: center; }
.sheet { width: min(100%, 30rem); background: var(--surface); border-radius: 18px 18px 0 0; padding: 1rem 18px calc(1.2rem + var(--sab)); display: grid; gap: 1rem; max-height: 85%; overflow-y: auto; }
.sheet h2 { margin: 0; font-size: 1.2rem; font-weight: 400; }
.sheet .row { display: grid; gap: .45rem; }
.sheet .row > span { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.seg { display: flex; background: var(--box-bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
.seg button { flex: 1; min-height: 40px; border-radius: 4px; font-size: .92rem; font-weight: 400; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.sheet .note { font-size: .8rem; color: var(--muted); line-height: 1.45; margin: 0; }
.sheet .done { min-height: 46px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.sheet .link { color: var(--accent); font-weight: 600; justify-self: start; min-height: 40px; }

/* ---------- right-thumb back button ---------- */
.back-btn { display: inline-flex; align-items: center; gap: .2rem; min-height: 44px; min-width: 96px; justify-content: center; padding: 0 1rem 0 .7rem; margin: 5px 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 1rem; }
.back-btn svg { width: 20px; height: 20px; }
#detailPane.dragging { transition: none !important; }
</style>
</head>
<body>
<div id="app" class="one">
  <section class="pane" id="listPane" aria-label="Stories">
    <header class="bar topbar">
      <div class="brand">
        <button class="menu-btn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="1" y="3" width="22" height="2.6" rx="1"/><rect x="1" y="9.5" width="22" height="2.6" rx="1"/><rect x="1" y="16" width="22" height="2.6" rx="1"/><circle cx="3.5" cy="22" r="1.3"/><circle cx="8" cy="22" r="1.3"/><circle cx="12.5" cy="22" r="1.3"/></svg></button>
        <span class="brand-txt"><b>Hacker News</b><small id="secLabel">Frontpage</small></span>
      </div>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh stories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="scroller" id="listScroller">
      <div class="ptr" id="ptr"><span>Pull to refresh</span></div>
      <ol class="list" id="list"></ol>
      <div class="list-foot" id="listFoot"></div>
    </div>
    <nav class="bar bottombar" aria-label="Sections"><div class="tabs" role="tablist" id="tabs"></div></nav>
  </section>

  <div id="spine" aria-hidden="true"></div>

  <section class="pane" id="detailPane" aria-label="Story and comments">
    <header class="bar topbar">
      <div class="d-title-bar" id="dTitleBar"></div>
      <button class="icon-btn" id="dRefreshBtn" aria-label="Reload comments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </header>
    <div class="scroller" id="detailScroller"><div class="detail" id="detail"></div></div>
    <button class="fab" id="nextBtn" aria-label="Jump to next thread" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <nav class="bar bottombar" aria-label="Story actions">
      <a class="icon-btn" id="dArticle" target="_blank" rel="noopener noreferrer" aria-label="Open article"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
      <button class="icon-btn" id="dSave" aria-label="Save story" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
      <button class="icon-btn" id="dShare" aria-label="Share" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg></button>
      <a class="icon-btn" id="dHN" target="_blank" rel="noopener noreferrer" aria-label="Open on Hacker News"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
      <span style="flex:1"></span>
      <button class="back-btn only-one" id="backBtn" aria-label="Back to stories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
    </nav>
  </section>
</div>
<div class="sheet-wrap" id="sheet" hidden></div>

<script>window.APP_CFG={serviceWorker:true,ownTheme:true};</script>
<script>
(() => {
'use strict';
const CFG = window.APP_CFG || {};
const DEMO = window.APP_DEMO || null;
const FB = 'https://hacker-news.firebaseio.com/v0';
const AL = 'https://hn.algolia.com/api/v1';
const PAGE = 30;

const ICONS = {

/* ---------- storage (best effort) ---------- */
const store = {
  get(k, d) { try { let v = localStorage.getItem('hn:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hn:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

/* ---------- dom ---------- */
const $ = (id) => document.getElementById(id);

const detail = $('detail'), detailScroller = $('detailScroller'), detailPane = $('detailPane');
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids) if (k != null) el.append(k);
  return el;
}
const svg = (inner) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.innerHTML = inner; return s; };

/* ---------- formatting ---------- */
function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  const n = (v, unit) => v + ' ' + unit + (v === 1 ? '' : 's');
  if (s < 60) return 'now';
  if (s < 3600) return n(Math.floor(s / 60), 'min');
  if (s < 86400) return n(Math.floor(s / 3600), 'hr');
  if (s < 86400 * 30) return n(Math.floor(s / 86400), 'day');
  return new Date(t * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function domain(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
const hnUrl = (id) => 'https://news.ycombinator.com/item?id=' + id;
const bare = (url) => String(url || '').replace(/^https?:\/\//, '');
const ICON = {
  out: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  person: '<circle cx="12" cy="7" r="5" fill="currentColor" stroke="none"/><path d="M2 23c0-6 4.5-10 10-10s10 4 10 10z" fill="currentColor" stroke="none"/>',

/* HN text is HTML. Rebuild it from an allowlist so nothing but plain formatting and http(s) links survives. */
const ALLOWED = new Set(['P', 'A', 'I', 'B', 'EM', 'STRONG', 'PRE', 'CODE', 'BR']);
function sanitize(html) {
  const frag = document.createDocumentFragment();
  if (!html) return frag;
  const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  (function walk(src, dst) {
    for (const n of Array.from(src.childNodes)) {
      if (n.nodeType === 3) { dst.append(n.nodeValue); continue; }
      if (n.nodeType !== 1 || n.tagName === 'SCRIPT' || n.tagName === 'STYLE') continue;
      if (!ALLOWED.has(n.tagName)) { walk(n, dst); continue; }
      const el = document.createElement(n.tagName.toLowerCase());
      if (n.tagName === 'A') {
        const href = n.getAttribute('href') || '';
        const m = href.match(/^https?:\/\/news\.ycombinator\.com\/item\?id=(\d+)/i);
        if (m) el.href = '#item-' + m[1];
        else if (/^https?:\/\//i.test(href)) { el.href = href; el.target = '_blank'; el.rel = 'noopener noreferrer'; }
      }
      walk(n, el);
      dst.append(el);
    }
  })(doc.body.firstChild, frag);
  // Mark ">" quote paragraphs so they read as quotes
  return frag;
}

/* ---------- data ---------- */
let demo = false;
const itemCache = new Map();
async function getJSON(url, ms = 12000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function enterDemo() {
  if (demo || !DEMO) return;
  demo = true;
  itemCache.clear();
  const b = $('banner');
  b.textContent = DEMO.note || 'Showing a saved snapshot.';
  b.hidden = false;
}
async function loadFeed(sec) {
  if (sec.id === 'saved') return saved.map((s) => s.id);
  if (!demo) {
    try { return await getJSON(`${FB}/${sec.feed}.json`); }
    catch (e) { if (!DEMO) throw e; enterDemo(); }
  }
  return DEMO.feeds[sec.id] || [];
}
function getItem(id, fresh) {
  if (!fresh && itemCache.has(id)) return itemCache.get(id);
  const p = demo
    ? Promise.resolve((DEMO.items[id]) || saved.find((s) => s.id === id) || null)
    : getJSON(`${FB}/item/${id}.json`).catch((e) => { itemCache.delete(id); throw e; });
  itemCache.set(id, p);
  return p;
}
function normAlgolia(n) {
  return { id: n.id, by: n.author, time: n.created_at_i, text: n.text, kids: (n.children || []).map(normAlgolia) };
}
async function firebaseTree(ids, depth) {
  if (!ids || !ids.length || depth > 10) return [];
  const items = await Promise.all(ids.map((id) => getItem(id).catch(() => null)));
  return Promise.all(items.filter(Boolean).map(async (c) => ({
    id: c.id, by: c.by, time: c.time, text: c.deleted ? null : c.text, dead: c.dead,
    kids: await firebaseTree(c.kids, depth + 1),
  })));
}
async function getThread(story) {
  if (demo) return ((DEMO.comments[story.id] || {}).kids) || [];
  let kids;
  try { kids = normAlgolia(await getJSON(`${AL}/items/${story.id}`, 15000)).kids; }
  catch (e) { kids = await firebaseTree(story.kids, 0); }
  // Algolia does not keep HN's ranking; the story's own kids list does.
  if (story.kids && story.kids.length) {
    const rank = new Map(story.kids.map((id, i) => [id, i]));
    kids.sort((a, b) => (rank.has(a.id) ? rank.get(a.id) : 1e9) - (rank.has(b.id) ? rank.get(b.id) : 1e9));
  }
  return kids;
}
const prune = (cs) => cs.map((c) => ({ ...c, kids: prune(c.kids || []) })).filter((c) => c.text || c.kids.length);
const countAll = (cs) => cs.reduce((n, c) => n + 1 + countAll(c.kids), 0);

/* ---------- layout: one pane, or two pages split on the fold ---------- */
let twoPane = false;
function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  const segs = (window.viewport && window.viewport.segments) || null;
  const sideBySide = segs && segs.length === 2 && segs[0].y === segs[1].y;
  let two;
  if (settings.layout === 'one') two = false;
  else if (settings.layout === 'two') two = w >= 560;
  else two = sideBySide || w >= 760;
  let split = '50%', gap = 18;
  if (two) {
    if (sideBySide) {
      const foldL = segs[0].x + segs[0].width, foldR = segs[1].x;
      gap = Math.max(foldR - foldL, 18);
      split = Math.round((foldL + foldR) / 2 - gap / 2) + 'px';
    } else if (w > 1000 && w > h) {
      split = Math.round(Math.min(Math.max(w * 0.36, 360), 460)) + 'px';
      gap = 1;
    } else {
      split = Math.round(w / 2 - gap / 2) + 'px'; // a book-style foldable's crease runs down the middle
    }
  }
  app.style.setProperty('--split', split);
  app.style.setProperty('--gap', gap + 'px');
  if (two !== twoPane || !app.classList.contains(two ? 'two' : 'one')) {
    twoPane = two;
    app.classList.toggle('two', two);
    app.classList.toggle('one', !two);
    detailPane.style.transform = '';
    if (two && !current) showFirstStory();
  }
}

/* ---------- story list ---------- */
let section = SECTIONS.find((s) => s.id === settings.section) || SECTIONS[0];
let ids = [], shown = 0, loading = false, listGen = 0;

function renderTabs() {
  const tabs = $('tabs');
  tabs.textContent = '';
  for (const s of SECTIONS) {
    tabs.append(h('button', {
      class: 'tab', role: 'tab', 'aria-selected': String(s === section), id: 'tab-' + s.id,
      onclick: () => { if (s === section) { listScroller.scrollTo({ top: 0, behavior: 'smooth' }); return; } section = s; settings.section = s.id; saveSettings(); renderTabs(); loadList(); },
    }, svg(ICONS[s.id]), s.label));
  }
  $('secLabel').textContent = section.title || section.label;
}

function storyRow(it) {
  const lastCount = seen[it.id];
  const fresh = lastCount != null && it.descendants > lastCount ? it.descendants - lastCount : 0;
  const job = it.type === 'job';
  const meta = h('span', { class: 's-meta' },
    it.by ? h('span', { text: it.by }) : null,
    h('span', { text: ago(it.time) }),
    fresh ? h('span', { class: 'new', text: '+' + fresh + ' new' }) : null);
  return h('li', { class: 'story' + (lastCount != null ? ' read' : '') + (current && current.id === it.id ? ' sel' : ''), 'data-id': it.id },
    h('div', { class: 's-left' },
      h('a', { class: 's-main', href: '#item-' + it.id },
        h('span', { class: 's-title', text: it.title || '(untitled)' }), meta),
      it.url ? h('a', { class: 's-url', href: it.url, target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'Open article: ' + (it.title || ''), text: it.url }) : null),
    h('a', { class: 's-side', href: '#item-' + it.id, 'aria-label': job ? 'Open' : (it.descendants || 0) + ' comments, ' + (it.score || 0) + ' points' },
      job ? null : h('span', { class: 'bubble', text: String(it.descendants || 0) }),
      job ? null : h('span', { class: 'cbox', text: String(it.score || 0) })));
}

async function loadList() {
  const gen = ++listGen;
  ids = []; shown = 0;
  list.textContent = '';
  listFoot.textContent = '';
  for (let i = 0; i < 8; i++) list.append(h('li', { class: 'skel' }));
  listScroller.scrollTop = 0;
  $('refreshBtn').classList.add('spin');
  try {
    const got = await loadFeed(section);
    if (gen !== listGen) return;
    ids = got;
    list.textContent = '';
    if (!ids.length) {
      listFoot.textContent = '';
      listFoot.append(section.id === 'saved'
        ? 'Stories you save show up here. Tap the bookmark at the bottom of a story to save it.'
        : (demo ? 'This section is not in the saved snapshot.' : 'Nothing here right now.'));
    } else await more();
  } catch (e) {
    if (gen !== listGen) return;
    list.textContent = '';
    listFoot.textContent = '';
    listFoot.append(h('p', { text: 'Could not load stories. Check your connection.' }), h('button', { onclick: loadList, text: 'Try again' }));
  } finally {
    if (gen === listGen) $('refreshBtn').classList.remove('spin');
  }
}

async function more() {
  if (loading || shown >= ids.length) return;
  loading = true;
  const gen = listGen;
  const slice = ids.slice(shown, shown + PAGE);
  const start = shown;
  shown += slice.length;
  const items = await Promise.all(slice.map((id) => getItem(id).catch(() => null)));
  loading = false;
  if (gen !== listGen) return;
  items.forEach((it, i) => { if (it && !it.deleted && !it.dead) list.append(storyRow(it, start + i + 1)); });
  listFoot.textContent = shown < ids.length ? 'Loading more…' : (ids.length ? 'That’s everything in ' + section.label + '.' : '');
  if (twoPane && !current) showFirstStory();
  // keep filling if the first page did not reach the bottom
  requestAnimationFrame(() => { if (listScroller.scrollHeight <= listScroller.clientHeight + 200) more(); });
}
listScroller.addEventListener('scroll', () => {
  if (listScroller.scrollTop + listScroller.clientHeight > listScroller.scrollHeight - 600) more();
}, { passive: true });

/* pull to refresh */
(() => {
  const ptr = $('ptr');
  let y0 = null, dy = 0;
  listScroller.addEventListener('touchstart', (e) => { y0 = listScroller.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  listScroller.addEventListener('touchmove', (e) => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    ptr.style.height = Math.min(dy * 0.5, 70) + 'px';
    ptr.firstChild.textContent = dy * 0.5 > 56 ? 'Release to refresh' : 'Pull to refresh';
  }, { passive: true });
  listScroller.addEventListener('touchend', () => {
    if (y0 != null && dy * 0.5 > 56) { itemCache.clear(); loadList(); }
    y0 = null; ptr.style.height = '0';
  });
})();

/* ---------- story detail ---------- */
let current = null, detailGen = 0, topLevel = [];

function updateSaveBtn() { $('dSave').setAttribute('aria-pressed', String(!!(current && saved.some((s) => s.id === current.id)))); }

async function openStory(id, fresh) {
  const gen = ++detailGen;
  detail.textContent = '';
  detail.append(h('div', { class: 'skel' }), h('div', { class: 'skel' }), h('div', { class: 'skel' }));
  detailScroller.scrollTop = 0;
  $('nextBtn').hidden = true;
  $('dRefreshBtn').classList.add('spin');
  let it;
  try { it = await getItem(id, fresh); } catch (e) { it = null; }
  if (gen !== detailGen) return;
  if (!it) {
    $('dRefreshBtn').classList.remove('spin');
    detail.textContent = '';
    detail.append(h('div', { class: 'empty' }, h('p', { text: 'Could not load this story.' }), h('button', { onclick: () => openStory(id, true), text: 'Try again' })));
    return;
  }
  current = it;
  for (const li of list.querySelectorAll('.story')) li.classList.toggle('sel', +li.dataset.id === it.id);
  const title = it.title || ('Comment by ' + (it.by || 'unknown'));
  $('dTitleBar').textContent = title;
  const art = $('dArticle');
  if (it.url) { art.href = it.url; art.removeAttribute('aria-disabled'); art.style.opacity = ''; }
  else { art.removeAttribute('href'); art.setAttribute('aria-disabled', 'true'); art.style.opacity = '.35'; }
  $('dHN').href = hnUrl(it.id);
  updateSaveBtn();

  const isJob = it.type === 'job';
  const head = h('div', { class: 'd-head' },
    h('h1', null, it.url ? h('a', { href: it.url, target: '_blank', rel: 'noopener noreferrer', text: title }) : title),
    h('div', { class: 'd-meta' },
      it.score != null && !isJob ? h('span', { class: 'hbox', 'aria-label': it.score + ' points', text: String(it.score) }) : null,
      it.by ? h('span', { text: it.by }) : null,
      h('span', { text: ago(it.time) }),
      isJob ? null : h('span', { class: 'pts', 'aria-label': (it.descendants || 0) + ' comments' }, svg(ICON.bubble), String(it.descendants || 0))),
    h('div', { class: 'd-links' },
      it.url ? h('a', { class: 'd-link', href: it.url, target: '_blank', rel: 'noopener noreferrer' }, svg(ICON.out), h('span', { text: it.url })) : null,
      h('a', { class: 'd-link', href: hnUrl(it.id), target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'Open on Hacker News' }, svg(ICON.out), h('span', { text: bare(hnUrl(it.id)) }))));
  const story = it.text ? h('div', { class: 'd-story' }, h('div', { class: 'd-text' }, sanitize(it.text))) : null;
  const countEl = h('div', { class: 'd-count', text: 'Loading comments…' });
  const thread = h('div', { class: 'thread' });
  detail.textContent = '';
  detail.append(h('div', { class: 'd-top' }, head, story), countEl, thread);

  if (!it.kids || !it.kids.length) {
    $('dRefreshBtn').classList.remove('spin');
    countEl.textContent = it.type === 'job' ? '' : (demo && it.descendants ? it.descendants + ' comments \u00b7 not in this snapshot' : 'No comments yet');
    markSeen(it, 0);
    return;
  }
  let kids;
  try { kids = prune(await getThread(it)); } catch (e) { kids = null; }
  if (gen !== detailGen) return;
  $('dRefreshBtn').classList.remove('spin');
  if (!kids) {
    countEl.textContent = '';
    thread.append(h('div', { class: 'empty' }, h('p', { text: 'Could not load comments.' }), h('button', { onclick: () => openStory(id, true), text: 'Try again' })));
    return;
  }
  const total = countAll(kids);
  const known = it.descendants || total;
  countEl.textContent = known === 1 ? '1 comment' : known + ' comments';
  if (demo && total < known) countEl.textContent += ' · ' + total + ' in this snapshot';
  else countEl.hidden = true;
  markSeen(it, it.descendants != null ? it.descendants : total);
  topLevel = [];
  renderThreads(kids, thread, it.by, gen);
}

function markSeen(it, n) {
  seen[it.id] = n;
  const keys = Object.keys(seen);
  if (keys.length > 600) for (const k of keys.slice(0, keys.length - 500)) delete seen[k];
  store.set('seen', seen);
  const li = list.querySelector('.story[data-id="' + it.id + '"]');
  if (li) { li.classList.add('read'); const nb = li.querySelector('.new'); if (nb) nb.remove(); }
}

function renderComment(c, depth, op) {
  const kids = c.kids || [];
  const hidden = countAll(kids);
  const el = h('div', { class: 'c' + (c.text ? '' : ' dead'), 'data-depth': String(Math.min(depth, 7)), id: 'c-' + c.id });
  const head = h('button', { class: 'c-head', 'aria-expanded': 'true' },
    h('span', { class: 'by' }, svg(ICON.person), c.by || '[deleted]'),
    c.by && c.by === op ? h('span', { class: 'op', text: 'OP' }) : null,
    c.time ? h('span', { class: 'when' }, svg(ICON.clock), ago(c.time)) : null,
    h('span', { class: 'fold', text: String(hidden + 1) }));
  head.addEventListener('click', () => {
    const folded = el.classList.toggle('folded');
    head.setAttribute('aria-expanded', String(!folded));
    // keep the folded comment's header in view so the thumb stays in place
    if (folded) { const r = el.getBoundingClientRect(), s = detailScroller.getBoundingClientRect(); if (r.top < s.top) detailScroller.scrollTop += r.top - s.top - 8; }
  });
  const body = h('div', { class: 'c-body' }, h('div', { class: 'c-text' }, c.text ? sanitize(c.text) : '[deleted]'));
  if (kids.length) {
    const k = h('div', { class: 'c-kids' });
    for (const ch of kids) k.append(renderComment(ch, depth + 1, op));
    body.append(k);
  }
  el.append(h('div', { class: 'c-top' }, h('a', { class: 'c-reply', href: hnUrl(c.id), target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'Reply on Hacker News' }, svg(ICON.reply)), head), body);
  return el;
}

function renderThreads(kids, into, op, gen) {
  let i = 0;
  const step = () => {
    if (gen !== detailGen) return;
    const frag = document.createDocumentFragment();
    const end = Math.min(i + 20, kids.length);
    for (; i < end; i++) { const el = renderComment(kids[i], 0, op); topLevel.push(el); frag.append(el); }
    into.append(frag);
    $('nextBtn').hidden = topLevel.length < 2;
    if (i < kids.length) {
      const more = h('div', { class: 'more' });
      into.append(more);
      const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { io.disconnect(); more.remove(); step(); } }, { root: detailScroller, rootMargin: '800px' });
      io.observe(more);
    }
  };
  step();
}

$('nextBtn').addEventListener('click', () => {
  const top = detailScroller.getBoundingClientRect().top;
  const next = topLevel.find((el) => el.getBoundingClientRect().top > top + 12);
  if (next) detailScroller.scrollTo({ top: detailScroller.scrollTop + next.getBoundingClientRect().top - top - 8, behavior: 'smooth' });
});
$('dRefreshBtn').addEventListener('click', () => { if (current) openStory(current.id, true); });
$('dSave').addEventListener('click', () => {
  if (!current) return;
  const i = saved.findIndex((s) => s.id === current.id);
  if (i >= 0) saved.splice(i, 1);
  else saved.unshift({ id: current.id, title: current.title, url: current.url, by: current.by, time: current.time, score: current.score, descendants: current.descendants, kids: current.kids, type: current.type, text: current.text });
  store.set('saved', saved);
  updateSaveBtn();
  if (section.id === 'saved') loadList();
});
if (navigator.share) {
  const sb = $('dShare');
  sb.hidden = false;
  sb.addEventListener('click', () => {
    if (!current) return;
    navigator.share({ title: current.title, url: current.url || hnUrl(current.id) }).catch(() => {});
  });
}

async function showFirstStory() {
  if (current || !twoPane) return;
  const first = list.querySelector('.story');
  if (first) openStory(+first.dataset.id);
  else showEmptyDetail();
}
function showEmptyDetail() {
  detail.textContent = '';
  detail.append(h('div', { class: 'empty' }, svg('<path d="M3 5.5c3-1 6-1 8 .8v13c-2-1.8-5-1.8-8-.8z"/><path d="M21 5.5c-3-1-6-1-8 .8v13c2-1.8 5-1.8 8-.8z"/>'), h('p', { text: 'Pick a story to read its comments here.' })));
}

/* ---------- navigation: the hash names the open story ---------- */
let pushedByUs = 0;
function route() {
  const m = location.hash.match(/^#item-(\d+)$/);
  if (m) {
    app.classList.add('reading');
    if (!current || current.id !== +m[1]) openStory(+m[1]);
  } else {
    app.classList.remove('reading');
    if (!twoPane) { current = null; detailGen++; for (const li of list.querySelectorAll('.story.sel')) li.classList.remove('sel'); }
  }
}
window.addEventListener('hashchange', route);
list.addEventListener('click', (e) => { if (e.target.closest('.s-main')) pushedByUs++; });
function goBack() {
  if (pushedByUs > 0) { pushedByUs--; history.back(); }
  else location.hash = '';
}
$('backBtn').addEventListener('click', goBack);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !twoPane && app.classList.contains('reading')) goBack(); });

/* swipe right anywhere on the story to go back (one pane only) */
(() => {
  let x0 = null, y0 = 0, dx = 0, lock = null;
  detailPane.addEventListener('touchstart', (e) => {
    if (twoPane || !app.classList.contains('reading')) return;
    const t = e.touches[0];
    if (e.target.closest('pre')) { x0 = null; return; } // let code blocks scroll sideways
    x0 = t.clientX; y0 = t.clientY; dx = 0; lock = null;
  }, { passive: true });
  detailPane.addEventListener('touchmove', (e) => {
    if (x0 == null) return;
    const t = e.touches[0];
    const mx = t.clientX - x0, my = t.clientY - y0;
    if (lock == null && (Math.abs(mx) > 10 || Math.abs(my) > 10)) lock = Math.abs(mx) > Math.abs(my) * 1.4 && mx > 0 ? 'x' : 'y';
    if (lock !== 'x') return;
    dx = Math.max(0, mx);
    detailPane.classList.add('dragging');
    detailPane.style.transform = `translateX(${dx}px)`;
  }, { passive: true });
  const end = () => {
    if (x0 == null) return;
    x0 = null;
    detailPane.classList.remove('dragging');
    detailPane.style.transform = '';
    if (lock === 'x' && dx > Math.min(110, window.innerWidth * 0.25)) goBack();
  };
  detailPane.addEventListener('touchend', end);
  detailPane.addEventListener('touchcancel', end);
})();

/* ---------- settings ---------- */
const TEXT = { s: 0.9, m: 1, l: 1.12, xl: 1.25 };
function applySettings() {
  document.documentElement.style.setProperty('--fs', TEXT[settings.text] || 1);
  // Light unless night mode is switched on here. The phone's own dark mode is not followed.
  document.documentElement.classList.toggle('night', settings.theme === 'dark');
}
function seg(label, key, opts, note) {
  const row = h('div', { class: 'row' }, h('span', { text: label }));
  const box = h('div', { class: 'seg', role: 'group', 'aria-label': label });
  for (const [v, l] of opts) {
    box.append(h('button', {
      'aria-pressed': String(settings[key] === v), text: l,
      onclick: (e) => { settings[key] = v; saveSettings(); applySettings(); layout(); for (const b of box.children) b.setAttribute('aria-pressed', String(b === e.currentTarget)); },
    }));
  }
  row.append(box);
  if (note) row.append(h('p', { class: 'note', text: note }));
  return row;
}
function openSettings() {
  const sheet = $('sheet');
  sheet.textContent = '';
  const panel = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Settings' },
    h('h2', { text: 'Settings' }),
    seg('Text size', 'text', [['s', 'S'], ['m', 'M'], ['l', 'L'], ['xl', 'XL']]),
    seg('Layout', 'layout', [['auto', 'Auto'], ['one', 'One page'], ['two', 'Two pages']], 'Auto shows two pages, split on the fold, when a foldable is open.'),
    seg('Night mode', 'theme', [['light', 'Off'], ['dark', 'On']]),
    h('button', { class: 'link', text: 'Clear read history', onclick: (e) => { seen = {}; store.set('seen', seen); for (const li of list.querySelectorAll('.story.read')) li.classList.remove('read'); e.currentTarget.textContent = 'Read history cleared'; } }),
    h('button', { class: 'done', text: 'Done', onclick: closeSettings }));
  sheet.append(panel);
  sheet.hidden = false;
  panel.querySelector('button').focus();
}
function closeSettings() { $('sheet').hidden = true; $('settingsBtn').focus(); }
$('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSettings(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) closeSettings(); });
$('settingsBtn').addEventListener('click', openSettings);
$('refreshBtn').addEventListener('click', () => { itemCache.clear(); loadList(); });

/* ---------- start ---------- */
applySettings();
renderTabs();
layout();
window.addEventListener('resize', layout);
if (window.viewport && window.viewport.addEventListener) { try { window.viewport.addEventListener('segmentschange', layout); } catch (e) { /* not supported */ } }
if (!/^#item-\d+$/.test(location.hash)) showEmptyDetail();
loadList();
route();
if (CFG.serviceWorker && 'serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
</body>
